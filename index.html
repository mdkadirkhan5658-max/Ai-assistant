### এটি চালানোর নিয়ম:

১. প্রথমে আপনার কম্পিউটারে Flask ইনস্টল করুন:
   `pip install flask google-generativeai`

২. একটি ফোল্ডার তৈরি করুন এবং এর ভেতরে `app.py` ফাইলটি রাখুন।
৩. ওই ফোল্ডারের ভেতরে `templates` নামে একটি ফোল্ডার তৈরি করুন এবং তার ভেতর `index.html` ফাইলটি রাখুন।

৪. এবার টার্মিনালে বা সিএমডিতে গিয়ে রান করুন:
   `python app.py`

৫. ব্রাউজারে গিয়ে `http://127.0.0.1:5000` লিংকে প্রবেশ করলেই আপনার নিজের এআই কোড পার্টনার চালু হয়ে যাবে!

**সুবিধা:** পাইথন ব্যবহার করায় জেমিনি এখন অনেক বেশি ডাটা হ্যান্ডেল করতে পারবে এবং আপনি চাইলে ভবিষ্যতে এতে **ফাইল আপলোড** বা **কোড সেভ** করার ফিচারও যুক্ত করতে পারবেন। এটি আপনার গিটহাব পোর্টফোলিওর জন্য একটি দুর্দান্ত প্রজেক্ট হবে!
